<html>
  <head>
    <title>Movie Page</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Find Your Film</h1>
    <div class="container">
      <img src="img/image.png" alt="Movie Image" class="Movie-image" />
    </div>
    <button id="watch-list">My Watchlist</button>
    <div class="searching">
      <input type="text" id="moviename" placeholder="Search the movie">
     <button id="search">
            Search
        </button>
    </div>
    <div id="movie-results"></div>
  </body>
  <script src="index.js"></script>
</html>
