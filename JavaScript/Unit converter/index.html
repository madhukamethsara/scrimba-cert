<html>

<head>
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="unitconverter">
        <h1 class="main">Metric/Imperial Unit Conversion </h1>
        <input type="text" id="inputValue" placeholder="Enter value to convert">
        <button id="convert" onclick="convertUnits()">
            Convert
        </button>
    </div>
    <div class="unitconverter">

        <div class="Length">
            <h2>Length (Meter/Feet)</h2>

            <p id="length1"></p>
            <p id="length2"></p>
        </div>

        <div class="Volume">
            <h2>Volume (Liter/Gallon)</h2>

            <p id="volume1"></p>
            <p id="volume2"></p>
        </div>

        <div class="Mass">
            <h2>Mass (Kilogram/Pound)</h2>

            <p id="mass1"></p>
            <p id="mass2"></p>
        </div>

    </div>

</body>
<script src="script.js"></script>

</html>
